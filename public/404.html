<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | GreenLoop NZ</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="not-found">
    <main class="page">
      <section class="page-hero compact">
        <div>
          <p class="eyebrow">404</p>
          <h1>That page does not exist.</h1>
          <p class="lede">A commercial site should not dump users onto the homepage when a route is wrong. This page gives them a clean recovery path.</p>
        </div>
      </section>

      <section class="content-grid single">
        <article class="main-card stack-form">
          <h2>Try one of these instead</h2>
          <div class="button-row">
            <a class="btn-brand" href="/marketplace">Browse marketplace</a>
            <a class="ghost-button" href="/services">Open services</a>
            <a class="ghost-button" href="/opportunities">See jobs</a>
            <a class="ghost-button" href="/help">Get help</a>
          </div>
        </article>
      </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="/app-shell.js"></script>
  </body>
</html>
