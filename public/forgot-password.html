<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | GreenLoop NZ</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="forgot-password">
    <main class="auth-shell">
      <section class="auth-panel auth-panel-dark">
        <p class="eyebrow">Account recovery</p>
        <h1>Reset access without rebuilding your account.</h1>
        <p>Request a reset link for your student email. Recovery mail now comes from our `noreply` sender.</p>
      </section>
      <section class="auth-panel">
        <a class="brand brand-static" href="/">GreenLoop</a>
        <h2>Forgot password</h2>
        <form id="forgot-form" class="stack-form">
          <input name="email" type="email" placeholder="Student email" required />
          <button type="submit">Send reset email</button>
        </form>
        <div id="forgot-output" class="info-box"></div>
        <p class="fine-print"><a href="/login">Back to login</a></p>
      </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="/app-shell.js"></script>
    <script src="/forgot-password.js"></script>
  </body>
</html>
