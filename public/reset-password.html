<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | GreenLoop NZ</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="reset-password">
    <main class="auth-shell">
      <section class="auth-panel auth-panel-dark">
        <p class="eyebrow">Secure reset</p>
        <h1>Choose a new password for your account.</h1>
        <p>Use at least 8 characters with letters and numbers.</p>
      </section>
      <section class="auth-panel">
        <a class="brand brand-static" href="/">GreenLoop</a>
        <h2>Reset password</h2>
        <form id="reset-form" class="stack-form">
          <input id="token" name="token" placeholder="Reset token" required />
          <p id="token-hint" class="fine-print">If you opened this page from email, the token should already be filled in.</p>
          <input name="password" type="password" placeholder="New password" required />
          <input name="confirmPassword" type="password" placeholder="Confirm new password" required />
          <button type="submit">Set new password</button>
        </form>
        <p class="fine-print"><a href="/login">Back to login</a></p>
      </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="/app-shell.js"></script>
    <script src="/reset-password.js"></script>
  </body>
</html>
